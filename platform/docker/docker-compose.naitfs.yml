services:
  naitfs-postgres:
    image: postgres:16
    container_name: naitfs-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-naitfs_db}
      POSTGRES_USER: ${POSTGRES_USER:-naitfs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-naitfs_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - naitfs_postgres_data:/var/lib/postgresql/data
    networks:
      - naitfs-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  naitfs-adminer:
    image: adminer:latest
    container_name: naitfs-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8086}:8080"
    depends_on:
      - naitfs-postgres
    networks:
      - naitfs-net

  naitfs-qdrant:
    image: qdrant/qdrant:latest
    container_name: naitfs-qdrant
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - naitfs_qdrant_data:/qdrant/storage
    networks:
      - naitfs-net

  naitfs-minio:
    image: quay.io/minio/minio:latest
    container_name: naitfs-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - naitfs_minio_data:/data
    networks:
      - naitfs-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  naitfs-kafka:
    image: apache/kafka:3.9.2
    container_name: naitfs-kafka
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    expose:
      - "29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@naitfs-kafka:9093
      KAFKA_LISTENERS: PLAINTEXT_HOST://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://${KAFKA_ADVERTISED_HOST:-127.0.0.1}:${KAFKA_HOST_PORT:-9092},PLAINTEXT_INTERNAL://naitfs-kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - naitfs_kafka_data:/tmp/kraft-combined-logs
    networks:
      - naitfs-net

  naitfs-keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: naitfs-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    networks:
      - naitfs-net

  naitfs-jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: naitfs-jaeger
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    networks:
      - naitfs-net

volumes:
  naitfs_postgres_data:
  naitfs_qdrant_data:
  naitfs_minio_data:
  naitfs_kafka_data:

networks:
  naitfs-net:
    name: naitfs-net
