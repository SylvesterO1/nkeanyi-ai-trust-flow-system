server:
  port: ${COMPLIANCE_EVIDENCE_SERVICE_PORT:8084}

spring:
  application:
    name: compliance-evidence-service

  datasource:
    url: ${COMPLIANCE_DATASOURCE_URL:jdbc:postgresql://localhost:5432/naitfs_db}
    username: ${COMPLIANCE_DATASOURCE_USERNAME:naitfs_user}
    password: ${COMPLIANCE_DATASOURCE_PASSWORD:naitfs_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: compliance

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: compliance
    default-schema: compliance
    table: compliance_schema_history

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    consumer:
      group-id: compliance-evidence-service
      auto-offset-reset: earliest
      enable-auto-commit: true
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    admin:
      auto-create: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

naitfs:
  kafka:
    topics:
      document-extracted: document.extracted.v1
      document-extraction-failed: document.extraction.failed.v1
      knowledge-answer-generated: knowledge.answer.generated.v1
      knowledge-answer-failed: knowledge.answer.failed.v1
      payment-received: payment.received
      payment-audit: payment.audit.v1
      payment-status-changed: payment.status.changed.v1
      payment-processed: payment.processed
      payment-rejected: payment.rejected
