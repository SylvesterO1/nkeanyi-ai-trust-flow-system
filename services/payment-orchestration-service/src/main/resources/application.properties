spring.application.name=payment-orchestration-service

server.port=${PAYMENT_ORCHESTRATION_SERVICE_PORT:8082}

spring.datasource.url=${PAYMENT_DATASOURCE_URL:jdbc:postgresql://localhost:5432/naitfs_db}
spring.datasource.username=${PAYMENT_DATASOURCE_USERNAME:naitfs_user}
spring.datasource.password=${PAYMENT_DATASOURCE_PASSWORD:naitfs_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.default_schema=payment

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=payment
spring.flyway.default-schema=payment
spring.flyway.table=payment_schema_history

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.nkeanyi.payment.event
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

app.security.enabled=${APP_SECURITY_ENABLED:false}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://localhost:8081/realms/payment-platform}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.endpoint.prometheus.access=unrestricted

management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging.pattern.level=%5p [${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}]

logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.kafka=INFO

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-actuator=true

# JPA
spring.jpa.open-in-view=false

# MVP 6 observability: propagate tenant/correlation IDs into Kafka producer headers
spring.kafka.producer.properties.interceptor.classes=com.nkeanyi.payment.observability.KafkaTenantCorrelationProducerInterceptor
